[settings]
lockfile = true

[tools]
rust = "1.98"

[tasks.build]
description = "Build in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.lint]
description = "Lint with clippy"
run = "cargo clippy"

[tasks.format]
description = "Format the source"
run = "cargo fmt"
